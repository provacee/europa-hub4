<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Europa Hub — Plataforma digital interna del Club Esportiu Europa">
  <title>Europa Hub · CE Europa</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Europa Hub">
  <link rel="apple-touch-icon" href="assets/escut.svg">

  <!-- Android / Chrome -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#060d1c" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#0A84FF" media="(prefers-color-scheme: light)">

  <!-- Tile (Windows) -->
  <meta name="msapplication-TileColor" content="#060d1c">
  <meta name="msapplication-TileImage" content="assets/escut.svg">

  <link rel="icon" href="assets/escut.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div id="app"></div>

  <!-- PDF / Excel libraries (acreditacions) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <!-- Supabase JS (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Configuració (edita js/config.js amb les teves credencials de Supabase) -->
  <script src="js/config.js"></script>

  <!-- Core: constants de dades per defecte, auth, render, routing -->
  <script src="js/core.js"></script>

  <!-- Capa de base de dades: Supabase + localStorage fallback -->
  <script src="js/db.js"></script>

  <!-- Pàgines -->
  <script src="js/pages1.js"></script>
  <script src="js/pages2.js"></script>
  <script src="js/pages3.js"></script>
  <script src="js/events.js"></script>
  <script src="js/pwa-init.js"></script>
</body>
</html>
